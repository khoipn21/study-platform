syntax = "proto3";

package progress;

option go_package = "github.com/study-platform/progress-service/proto";

import "google/protobuf/timestamp.proto";

service ProgressService {
    // Progress tracking
    rpc UpdateProgress(UpdateProgressRequest) returns (UpdateProgressResponse);
    rpc GetProgress(GetProgressRequest) returns (GetProgressResponse);
    rpc GetUserProgress(GetUserProgressRequest) returns (GetUserProgressResponse);
    rpc GetCourseProgress(GetCourseProgressRequest) returns (GetCourseProgressResponse);
    
    // Enrollment management
    rpc CreateEnrollment(CreateEnrollmentRequest) returns (CreateEnrollmentResponse);
    rpc GetEnrollment(GetEnrollmentRequest) returns (GetEnrollmentResponse);
    rpc ListEnrollments(ListEnrollmentsRequest) returns (ListEnrollmentsResponse);
    rpc UpdateEnrollmentStatus(UpdateEnrollmentStatusRequest) returns (UpdateEnrollmentStatusResponse);
    
    // Course completion
    rpc MarkLectureComplete(MarkLectureCompleteRequest) returns (MarkLectureCompleteResponse);
    rpc GetLectureProgress(GetLectureProgressRequest) returns (GetLectureProgressResponse);
    rpc GetCourseCompletion(GetCourseCompletionRequest) returns (GetCourseCompletionResponse);
    
    // Analytics
    rpc GetUserAnalytics(GetUserAnalyticsRequest) returns (GetUserAnalyticsResponse);
    rpc GetCourseAnalytics(GetCourseAnalyticsRequest) returns (GetCourseAnalyticsResponse);
    rpc GetInstructorAnalytics(GetInstructorAnalyticsRequest) returns (GetInstructorAnalyticsResponse);
}

// Core messages
message UserProgress {
    string id = 1;
    string user_id = 2;
    string course_id = 3;
    string lecture_id = 4;
    double progress_percentage = 5;
    int32 watch_time_seconds = 6;
    bool is_completed = 7;
    google.protobuf.Timestamp last_accessed = 8;
    google.protobuf.Timestamp completed_at = 9;
    google.protobuf.Timestamp created_at = 10;
    google.protobuf.Timestamp updated_at = 11;
}

message Enrollment {
    string id = 1;
    string user_id = 2;
    string course_id = 3;
    string status = 4; // enrolled, completed, cancelled, suspended
    double progress_percentage = 5;
    int32 completed_lectures = 6;
    int32 total_lectures = 7;
    int32 total_watch_time_seconds = 8;
    google.protobuf.Timestamp enrolled_at = 9;
    google.protobuf.Timestamp completed_at = 10;
    google.protobuf.Timestamp last_accessed = 11;
    google.protobuf.Timestamp created_at = 12;
    google.protobuf.Timestamp updated_at = 13;
}

message LectureProgress {
    string lecture_id = 1;
    string title = 2;
    int32 order_number = 3;
    double progress_percentage = 4;
    int32 watch_time_seconds = 5;
    bool is_completed = 6;
    google.protobuf.Timestamp last_accessed = 7;
    google.protobuf.Timestamp completed_at = 8;
}

message CourseCompletion {
    string course_id = 1;
    string course_title = 2;
    string user_id = 3;
    double completion_percentage = 4;
    int32 completed_lectures = 5;
    int32 total_lectures = 6;
    int32 total_watch_time_seconds = 7;
    repeated LectureProgress lecture_progress = 8;
    google.protobuf.Timestamp started_at = 9;
    google.protobuf.Timestamp completed_at = 10;
    google.protobuf.Timestamp last_accessed = 11;
}

message UserAnalytics {
    string user_id = 1;
    int32 total_courses_enrolled = 2;
    int32 total_courses_completed = 3;
    int32 total_lectures_completed = 4;
    int32 total_watch_time_seconds = 5;
    double average_progress_percentage = 6;
    int32 courses_in_progress = 7;
    string most_active_day = 8;
    int32 streak_days = 9;
    google.protobuf.Timestamp last_activity = 10;
}

message CourseAnalytics {
    string course_id = 1;
    int32 total_enrollments = 2;
    int32 total_completions = 3;
    double completion_rate = 4;
    double average_progress_percentage = 5;
    int32 active_students = 6;
    int32 total_watch_time_seconds = 7;
    double average_watch_time_per_student = 8;
    string most_popular_lecture = 9;
    double dropout_rate = 10;
}

message InstructorAnalytics {
    string instructor_id = 1;
    int32 total_courses = 2;
    int32 total_students = 3;
    int32 total_completions = 4;
    double average_completion_rate = 5;
    int32 total_watch_time_seconds = 6;
    double average_course_rating = 7;
    int32 active_courses = 8;
    string best_performing_course = 9;
    int32 total_revenue_cents = 10;
}

// Progress requests/responses
message UpdateProgressRequest {
    string user_id = 1;
    string course_id = 2;
    string lecture_id = 3;
    double progress_percentage = 4;
    int32 watch_time_seconds = 5;
    bool is_completed = 6;
}

message UpdateProgressResponse {
    UserProgress progress = 1;
    string message = 2;
}

message GetProgressRequest {
    string user_id = 1;
    string course_id = 2;
    string lecture_id = 3;
}

message GetProgressResponse {
    UserProgress progress = 1;
}

message GetUserProgressRequest {
    string user_id = 1;
    string course_id = 2;
}

message GetUserProgressResponse {
    repeated UserProgress progress = 1;
    double overall_progress_percentage = 2;
}

message GetCourseProgressRequest {
    string course_id = 1;
    int32 page = 2;
    int32 page_size = 3;
}

message GetCourseProgressResponse {
    repeated UserProgress progress = 1;
    int32 total_count = 2;
    int32 page = 3;
    int32 page_size = 4;
}

// Enrollment requests/responses
message CreateEnrollmentRequest {
    string user_id = 1;
    string course_id = 2;
}

message CreateEnrollmentResponse {
    Enrollment enrollment = 1;
    string message = 2;
}

message GetEnrollmentRequest {
    string user_id = 1;
    string course_id = 2;
}

message GetEnrollmentResponse {
    Enrollment enrollment = 1;
}

message ListEnrollmentsRequest {
    string user_id = 1;
    string status = 2;
    int32 page = 3;
    int32 page_size = 4;
}

message ListEnrollmentsResponse {
    repeated Enrollment enrollments = 1;
    int32 total_count = 2;
    int32 page = 3;
    int32 page_size = 4;
}

message UpdateEnrollmentStatusRequest {
    string user_id = 1;
    string course_id = 2;
    string status = 3;
}

message UpdateEnrollmentStatusResponse {
    Enrollment enrollment = 1;
    string message = 2;
}

// Course completion requests/responses
message MarkLectureCompleteRequest {
    string user_id = 1;
    string course_id = 2;
    string lecture_id = 3;
    int32 watch_time_seconds = 4;
}

message MarkLectureCompleteResponse {
    UserProgress progress = 1;
    bool course_completed = 2;
    string message = 3;
}

message GetLectureProgressRequest {
    string user_id = 1;
    string course_id = 2;
}

message GetLectureProgressResponse {
    repeated LectureProgress lecture_progress = 1;
}

message GetCourseCompletionRequest {
    string user_id = 1;
    string course_id = 2;
}

message GetCourseCompletionResponse {
    CourseCompletion completion = 1;
}

// Analytics requests/responses
message GetUserAnalyticsRequest {
    string user_id = 1;
}

message GetUserAnalyticsResponse {
    UserAnalytics analytics = 1;
}

message GetCourseAnalyticsRequest {
    string course_id = 1;
}

message GetCourseAnalyticsResponse {
    CourseAnalytics analytics = 1;
}

message GetInstructorAnalyticsRequest {
    string instructor_id = 1;
}

message GetInstructorAnalyticsResponse {
    InstructorAnalytics analytics = 1;
}