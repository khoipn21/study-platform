syntax = "proto3";

package auth;

option go_package = "github.com/study-platform/proto/auth";

import "google/protobuf/timestamp.proto";

service AuthService {
    rpc Register(RegisterRequest) returns (RegisterResponse);
    rpc Login(LoginRequest) returns (LoginResponse);
    rpc ValidateToken(ValidateTokenRequest) returns (ValidateTokenResponse);
    rpc GetUserRoles(GetUserRolesRequest) returns (GetUserRolesResponse);
    rpc AssignRole(AssignRoleRequest) returns (AssignRoleResponse);
    rpc RemoveRole(RemoveRoleRequest) returns (RemoveRoleResponse);
    rpc GetOAuthURL(GetOAuthURLRequest) returns (GetOAuthURLResponse);
    rpc OAuthCallback(OAuthCallbackRequest) returns (OAuthCallbackResponse);
    rpc LinkOAuthAccount(LinkOAuthAccountRequest) returns (LinkOAuthAccountResponse);
    rpc UnlinkOAuthAccount(UnlinkOAuthAccountRequest) returns (UnlinkOAuthAccountResponse);
    rpc GetLinkedAccounts(GetLinkedAccountsRequest) returns (GetLinkedAccountsResponse);
}

message User {
    string id = 1;
    string username = 2;
    string email = 3;
    string role = 4;
    google.protobuf.Timestamp created_at = 5;
    google.protobuf.Timestamp updated_at = 6;
}

message RegisterRequest {
    string username = 1;
    string email = 2;
    string password = 3;
    string role = 4;
}

message RegisterResponse {
    User user = 1;
    string token = 2;
    string message = 3;
}

message LoginRequest {
    string email = 1;
    string password = 2;
}

message LoginResponse {
    User user = 1;
    string token = 2;
    string message = 3;
}

message ValidateTokenRequest {
    string token = 1;
}

message ValidateTokenResponse {
    bool valid = 1;
    User user = 2;
    string message = 3;
}

message GetUserRolesRequest {
    string user_id = 1;
}

message GetUserRolesResponse {
    repeated string roles = 1;
}

message AssignRoleRequest {
    string user_id = 1;
    string role = 2;
}

message AssignRoleResponse {
    bool success = 1;
    string message = 2;
}

message RemoveRoleRequest {
    string user_id = 1;
    string role = 2;
}

message RemoveRoleResponse {
    bool success = 1;
    string message = 2;
}

message GetOAuthURLRequest {
    string provider = 1;
    string state = 2;
}

message GetOAuthURLResponse {
    string url = 1;
}

message OAuthCallbackRequest {
    string provider = 1;
    string code = 2;
    string state = 3;
}

message OAuthCallbackResponse {
    User user = 1;
    string token = 2;
    bool is_new_user = 3;
    repeated string linked_accounts = 4;
    string message = 5;
}

message LinkOAuthAccountRequest {
    string user_id = 1;
    string provider = 2;
    string code = 3;
}

message LinkOAuthAccountResponse {
    bool success = 1;
    string message = 2;
}

message UnlinkOAuthAccountRequest {
    string user_id = 1;
    string provider = 2;
}

message UnlinkOAuthAccountResponse {
    bool success = 1;
    string message = 2;
}

message GetLinkedAccountsRequest {
    string user_id = 1;
}

message GetLinkedAccountsResponse {
    repeated string providers = 1;
}