version: "3.8"

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-studyplatform}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "2345:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB:-studyplatform}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  auth-service:
    build:
      context: .
      dockerfile: Dockerfile.auth
    ports: []
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      GRPC_PORT: ${GRPC_PORT_AUTH:-8081}
      BCRYPT_ROUNDS: ${BCRYPT_ROUNDS:-12}
      JWT_EXPIRY: ${JWT_EXPIRY:-24h}
      JWT_REFRESH_EXPIRY: ${JWT_REFRESH_EXPIRY:-168h}
      DB_MAX_CONNECTIONS: ${DB_MAX_CONNECTIONS:-25}
      DB_MAX_IDLE_CONNECTIONS: ${DB_MAX_IDLE_CONNECTIONS:-5}
      DB_CONNECTION_LIFETIME: ${DB_CONNECTION_LIFETIME:-300s}
    volumes:
      - ./auth-service:/app
    healthcheck:
      test: ["CMD", "grpc_health_probe", "-addr=:${GRPC_PORT_AUTH:-8081}"]
      interval: 30s
      timeout: 10s
      retries: 3

  course-service:
    build:
      context: .
      dockerfile: Dockerfile.course
    ports: []
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      GRPC_PORT: ${GRPC_PORT_COURSE:-8082}
      HTTP_PORT: ${HTTP_PORT_COURSE:-8092}
      DB_MAX_CONNECTIONS: ${DB_MAX_CONNECTIONS:-25}
      DB_MAX_IDLE_CONNECTIONS: ${DB_MAX_IDLE_CONNECTIONS:-5}
      DB_CONNECTION_LIFETIME: ${DB_CONNECTION_LIFETIME:-300s}

      # AWS S3 Configuration
      AWS_REGION: ${S3_REGION}
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
    volumes:
      - ./course-service:/app
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "${GRPC_PORT_COURSE:-8082}"]
      interval: 30s
      timeout: 10s
      retries: 3

  progress-service:
    build:
      context: .
      dockerfile: Dockerfile.progress
    ports: []
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      GRPC_PORT: ${GRPC_PORT_PROGRESS:-8083}
      DB_MAX_CONNECTIONS: ${DB_MAX_CONNECTIONS:-25}
      DB_MAX_IDLE_CONNECTIONS: ${DB_MAX_IDLE_CONNECTIONS:-5}
      DB_CONNECTION_LIFETIME: ${DB_CONNECTION_LIFETIME:-300s}
    volumes:
      - ./progress-service:/app
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "${GRPC_PORT_PROGRESS:-8083}"]
      interval: 30s
      timeout: 10s
      retries: 3

  video-service:
    build:
      context: ./video-service
      dockerfile: Dockerfile
    ports: []
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      # Database Configuration
      DB_HOST: ${DB_HOST:-postgres}
      DB_PORT: ${DB_PORT:-5432}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME:-studyplatform}
      DB_SSLMODE: ${DB_SSLMODE:-disable}
      DB_MAX_CONNECTIONS: ${DB_MAX_CONNECTIONS:-25}
      DB_MAX_IDLE_CONNECTIONS: ${DB_MAX_IDLE_CONNECTIONS:-5}
      DB_CONNECTION_LIFETIME: ${DB_CONNECTION_LIFETIME:-300s}

      # Service Configuration
      VIDEO_SERVICE_PORT: ${VIDEO_SERVICE_PORT:-8084}
      VIDEO_SERVICE_HOST: ${VIDEO_SERVICE_HOST:-0.0.0.0}

      # Cloudflare Stream Configuration
      CLOUDFLARE_ACCOUNT_ID: ${CLOUDFLARE_ACCOUNT_ID}
      CLOUDFLARE_STREAM_TOKEN: ${CLOUDFLARE_STREAM_TOKEN}

      # Redis Configuration
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_DB: ${REDIS_DB:-0}
      REDIS_MAX_CONNECTIONS: ${REDIS_MAX_CONNECTIONS:-10}

      # Security
      JWT_SECRET: ${JWT_SECRET}
      CORS_ORIGINS: ${CORS_ORIGINS}
    volumes:
      - ./video-service:/app
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:${VIDEO_SERVICE_PORT:-8084}/health",
        ]
      interval: 30s
      timeout: 10s
      retries: 3

  bucket-service:
    build:
      context: ./bucket-service
      dockerfile: Dockerfile
    ports: []
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Database Configuration
      DB_HOST: ${DB_HOST:-postgres}
      DB_PORT: ${DB_PORT:-5432}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME:-studyplatform}
      DB_SSLMODE: ${DB_SSLMODE:-disable}
      DB_MAX_CONNECTIONS: ${DB_MAX_CONNECTIONS:-25}
      DB_MAX_IDLE_CONNECTIONS: ${DB_MAX_IDLE_CONNECTIONS:-5}
      DB_CONNECTION_LIFETIME: ${DB_CONNECTION_LIFETIME:-300s}

      # AWS S3 Configuration
      S3_ENDPOINT: ${S3_ENDPOINT:-https://s3.amazonaws.com}
      S3_REGION: ${S3_REGION}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}

      # Bucket Names
      S3_BUCKET_FILES: ${S3_BUCKET_FILES}
      S3_BUCKET_DOCUMENTS: ${S3_BUCKET_DOCUMENTS}
      S3_BUCKET_IMAGES: ${S3_BUCKET_IMAGES}
      S3_BUCKET_AVATARS: ${S3_BUCKET_AVATARS}
      S3_BUCKET_COURSE_MATERIALS: ${S3_BUCKET_COURSE_MATERIALS}

      # Service Configuration
      BUCKET_SERVICE_PORT: ${BUCKET_SERVICE_PORT:-8085}
      BUCKET_SERVICE_HOST: ${BUCKET_SERVICE_HOST:-0.0.0.0}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      JWT_SECRET: ${JWT_SECRET}

      # Security & CORS
      CORS_ORIGINS: ${CORS_ORIGINS}
      RATE_LIMIT_REQUESTS: ${RATE_LIMIT_REQUESTS:-100}
      RATE_LIMIT_WINDOW: ${RATE_LIMIT_WINDOW:-60s}
      RATE_LIMIT_BURST: ${RATE_LIMIT_BURST:-200}
    volumes:
      - ./bucket-service:/app
      - bucket_logs:/app/logs
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:${BUCKET_SERVICE_PORT:-8085}/health",
        ]
      interval: 30s
      timeout: 10s
      retries: 3

  chatbot-service:
    build:
      context: ./chatbot-service
      dockerfile: Dockerfile
    ports: []
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Database Configuration
      DB_HOST: ${DB_HOST:-postgres}
      DB_PORT: ${DB_PORT:-5432}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME:-studyplatform}
      DB_SSLMODE: ${DB_SSLMODE:-disable}
      DB_MAX_CONNECTIONS: ${DB_MAX_CONNECTIONS:-25}
      DB_MAX_IDLE_CONNECTIONS: ${DB_MAX_IDLE_CONNECTIONS:-5}
      DB_CONNECTION_LIFETIME: ${DB_CONNECTION_LIFETIME:-300s}

      # Service Configuration
      CHATBOT_PORT: ${CHATBOT_PORT:-8086}
      CHATBOT_HOST: ${CHATBOT_HOST:-0.0.0.0}

      # Gemini Configuration
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.0-flash-001}
      GEMINI_MAX_TOKENS: ${GEMINI_MAX_TOKENS:-2048}
      GEMINI_TEMPERATURE: ${GEMINI_TEMPERATURE:-0.7}

      # Redis Configuration
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_DB: ${REDIS_DB:-0}
      REDIS_MAX_CONNECTIONS: ${REDIS_MAX_CONNECTIONS:-10}

      # Security
      JWT_SECRET: ${JWT_SECRET}
      CORS_ORIGINS: ${CORS_ORIGINS}
      RATE_LIMIT_REQUESTS: ${RATE_LIMIT_REQUESTS:-100}
      RATE_LIMIT_WINDOW: ${RATE_LIMIT_WINDOW:-60s}
      RATE_LIMIT_BURST: ${RATE_LIMIT_BURST:-200}
    volumes:
      - ./chatbot-service:/app
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:${CHATBOT_PORT:-8086}/health",
        ]
      interval: 30s
      timeout: 10s
      retries: 3

  forum-service:
    build:
      context: ./forum-service
      dockerfile: Dockerfile
    ports: []
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Database Configuration
      DB_HOST: ${DB_HOST:-postgres}
      DB_PORT: ${DB_PORT:-5432}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME:-studyplatform}
      DB_SSLMODE: ${DB_SSLMODE:-disable}
      DB_MAX_CONNECTIONS: ${DB_MAX_CONNECTIONS:-25}
      DB_MAX_IDLE_CONNECTIONS: ${DB_MAX_IDLE_CONNECTIONS:-5}
      DB_CONNECTION_LIFETIME: ${DB_CONNECTION_LIFETIME:-300s}

      # Service Configuration
      FORUM_PORT: ${FORUM_PORT:-8087}
      FORUM_HOST: ${FORUM_HOST:-0.0.0.0}

      # Security
      JWT_SECRET: ${JWT_SECRET}
      CORS_ORIGINS: ${CORS_ORIGINS}
      RATE_LIMIT_REQUESTS: ${RATE_LIMIT_REQUESTS:-100}
      RATE_LIMIT_WINDOW: ${RATE_LIMIT_WINDOW:-60s}
      RATE_LIMIT_BURST: ${RATE_LIMIT_BURST:-200}
    volumes:
      - ./forum-service:/app
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:${FORUM_PORT:-8087}/health",
        ]
      interval: 30s
      timeout: 10s
      retries: 3

  payment-service:
    build:
      context: .
      dockerfile: Dockerfile.payment
    ports:
      - "8088:8088"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Database Configuration
      DB_HOST: ${DB_HOST:-postgres}
      DB_PORT: ${DB_PORT:-5432}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME:-studyplatform}
      DB_SSLMODE: ${DB_SSLMODE:-disable}
      DB_MAX_CONNECTIONS: ${DB_MAX_CONNECTIONS:-25}
      DB_MAX_IDLE_CONNECTIONS: ${DB_MAX_IDLE_CONNECTIONS:-5}
      DB_CONNECTION_LIFETIME: ${DB_CONNECTION_LIFETIME:-300s}

      # Service Configuration
      PAYMENT_PORT: ${PAYMENT_PORT:-8088}
      PAYMENT_HOST: ${PAYMENT_HOST:-0.0.0.0}

      # Payment Gateway Configuration
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
      PAYPAL_CLIENT_ID: ${PAYPAL_CLIENT_ID}
      PAYPAL_CLIENT_SECRET: ${PAYPAL_CLIENT_SECRET}
      PAYPAL_SANDBOX: ${PAYPAL_SANDBOX:-true}

      # Lemon Squeezy Configuration
      LEMON_SQUEEZY_API_KEY: ${LEMON_SQUEEZY_API_KEY}
      LEMON_SQUEEZY_STORE_ID: ${LEMON_SQUEEZY_STORE_ID}
      LEMON_SQUEEZY_PRODUCT_ID: ${LEMON_SQUEEZY_PRODUCT_ID}
      LEMON_SQUEEZY_VARIANT_ID: ${LEMON_SQUEEZY_VARIANT_ID}
      LEMON_SQUEEZY_WEBHOOK_SECRET: ${LEMON_SQUEEZY_WEBHOOK_SECRET}
      LEMON_SQUEEZY_WEBHOOK_URL: ${LEMON_SQUEEZY_WEBHOOK_URL}

      PAYMENT_CURRENCY: ${PAYMENT_CURRENCY:-USD}

      # Progress Service Integration
      PROGRESS_SERVICE_URL: ${PROGRESS_SERVICE_URL:-progress-service:8083}

      # Security
      JWT_SECRET: ${JWT_SECRET}
      CORS_ORIGINS: ${CORS_ORIGINS}
      RATE_LIMIT_REQUESTS: ${RATE_LIMIT_REQUESTS:-100}
      RATE_LIMIT_WINDOW: ${RATE_LIMIT_WINDOW:-60s}
      RATE_LIMIT_BURST: ${RATE_LIMIT_BURST:-200}
    volumes:
      - ./payment-service:/app
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:${PAYMENT_PORT:-8088}/health",
        ]
      interval: 30s
      timeout: 10s
      retries: 3

  instructor-dashboard-service:
    build:
      context: ./instructor-dashboard-service
      dockerfile: Dockerfile
    ports: []
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Database Configuration
      DATABASE_URL: ${DATABASE_URL}

      # Service Configuration
      PORT: ${INSTRUCTOR_DASHBOARD_PORT:-8089}

      # Security
      JWT_SECRET: ${JWT_SECRET}
      CORS_ORIGINS: ${CORS_ORIGINS}

      # Environment
      ENVIRONMENT: ${ENVIRONMENT:-development}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      - ./instructor-dashboard-service:/app
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--timeout=5",
          "-O",
          "/dev/null",
          "http://localhost:${INSTRUCTOR_DASHBOARD_PORT:-8089}/health",
        ]
      interval: 30s
      timeout: 10s
      retries: 3

  api-gateway:
    build:
      context: .
      dockerfile: Dockerfile.gateway
    ports:
      - "${API_GATEWAY_PORT:-8080}:${API_GATEWAY_PORT:-8080}"
    depends_on:
      - auth-service
      - course-service
      - progress-service
      - video-service
      - bucket-service
      - chatbot-service
      - forum-service
      - payment-service
      - instructor-dashboard-service
    environment:
      # Database Configuration
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-studyplatform}
      
      # MinIO Configuration
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      
      # Service URLs
      AUTH_SERVICE_URL: ${AUTH_SERVICE_URL:-auth-service:8081}
      COURSE_SERVICE_URL: ${COURSE_SERVICE_URL:-course-service:8082}
      PROGRESS_SERVICE_URL: ${PROGRESS_SERVICE_URL:-progress-service:8083}
      VIDEO_SERVICE_URL: ${VIDEO_SERVICE_URL:-http://video-service:8084}
      BUCKET_SERVICE_URL: ${BUCKET_SERVICE_URL:-http://bucket-service:8085}
      CHATBOT_SERVICE_URL: ${CHATBOT_SERVICE_URL:-http://chatbot-service:8086}
      FORUM_SERVICE_URL: ${FORUM_SERVICE_URL:-http://forum-service:8087}
      PAYMENT_SERVICE_URL: ${PAYMENT_SERVICE_URL:-http://payment-service:8088}
      INSTRUCTOR_DASHBOARD_SERVICE_URL: ${INSTRUCTOR_DASHBOARD_SERVICE_URL:-http://instructor-dashboard-service:8089}

      # Security Configuration
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRY: ${JWT_EXPIRY:-24h}
      JWT_REFRESH_EXPIRY: ${JWT_REFRESH_EXPIRY:-168h}

      # Server Configuration
      HTTP_PORT: ${API_GATEWAY_PORT:-8080}
      CORS_ORIGINS: ${CORS_ORIGINS}

      # Rate Limiting & Security
      RATE_LIMIT_REQUESTS: ${RATE_LIMIT_REQUESTS:-100}
      RATE_LIMIT_WINDOW: ${RATE_LIMIT_WINDOW:-60s}
      RATE_LIMIT_BURST: ${RATE_LIMIT_BURST:-200}
      SECURITY_HEADERS_ENABLED: ${SECURITY_HEADERS_ENABLED:-true}
      CONTENT_SECURITY_POLICY: ${CONTENT_SECURITY_POLICY:-default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'}

      # Environment
      ENVIRONMENT: ${ENVIRONMENT:-development}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DEBUG_MODE: ${DEBUG_MODE:-false}

      # Health Checks & Monitoring
      HEALTH_CHECK_ENABLED: ${HEALTH_CHECK_ENABLED:-true}
      HEALTH_CHECK_INTERVAL: ${HEALTH_CHECK_INTERVAL:-30s}
      HEALTH_CHECK_TIMEOUT: ${HEALTH_CHECK_TIMEOUT:-10s}
      HEALTH_CHECK_RETRIES: ${HEALTH_CHECK_RETRIES:-3}
      METRICS_ENABLED: ${METRICS_ENABLED:-true}
      METRICS_PORT: ${METRICS_PORT:-9090}
    volumes:
      - ./api-gateway:/app

volumes:
  postgres_data:
  redis_data:
  minio_data:
  bucket_logs:

networks:
  default:
    driver: bridge
