version: '3.8'

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: studyplatform
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
    ports:
      - "2345:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d studyplatform"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: password123
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  auth-service:
    build:
      context: .
      dockerfile: Dockerfile.auth
    ports:
      - "8081:8080"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://admin:password@postgres:5432/studyplatform?sslmode=disable
      JWT_SECRET: your-secret-key-here
      GRPC_PORT: 8080
    volumes:
      - ./auth-service:/app
    healthcheck:
      test: ["CMD", "grpc_health_probe", "-addr=:8080"]
      interval: 30s
      timeout: 10s
      retries: 3

  course-service:
    build:
      context: .
      dockerfile: Dockerfile.course
    ports:
      - "8082:8080"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://admin:password@postgres:5432/studyplatform?sslmode=disable
      GRPC_PORT: 8080
    volumes:
      - ./course-service:/app
    healthcheck:
      test: ["CMD", "grpc_health_probe", "-addr=:8080"]
      interval: 30s
      timeout: 10s
      retries: 3

  progress-service:
    build:
      context: .
      dockerfile: Dockerfile.progress
    ports:
      - "8083:8080"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://admin:password@postgres:5432/studyplatform?sslmode=disable
      GRPC_PORT: 8080
    volumes:
      - ./progress-service:/app
    healthcheck:
      test: ["CMD", "grpc_health_probe", "-addr=:8080"]
      interval: 30s
      timeout: 10s
      retries: 3

  video-service:
    build:
      context: .
      dockerfile: Dockerfile.video
    ports:
      - "8084:8080"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://admin:password@postgres:5432/studyplatform?sslmode=disable
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: admin
      MINIO_SECRET_KEY: password123
      HTTP_PORT: 8080
    volumes:
      - ./video-service:/app

  bucket-service:
    build:
      context: .
      dockerfile: Dockerfile.bucket
    ports:
      - "8085:8080"
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: admin
      MINIO_SECRET_KEY: password123
      HTTP_PORT: 8080
    volumes:
      - ./bucket-service:/app

  api-gateway:
    build:
      context: .
      dockerfile: Dockerfile.gateway
    ports:
      - "8080:8080"
    depends_on:
      - auth-service
      - course-service
      - progress-service
    environment:
      AUTH_SERVICE_URL: auth-service:8080
      COURSE_SERVICE_URL: course-service:8080
      PROGRESS_SERVICE_URL: progress-service:8080
      VIDEO_SERVICE_URL: video-service:8080
      BUCKET_SERVICE_URL: bucket-service:8080
      JWT_SECRET: your-secret-key-here
      HTTP_PORT: 8080
    volumes:
      - ./api-gateway:/app

volumes:
  postgres_data:
  redis_data:
  minio_data:

networks:
  default:
    driver: bridge