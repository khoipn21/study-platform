version: "3.8"

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: studyplatform
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
    ports:
      - "2345:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d studyplatform"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: password123
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  auth-service:
    build:
      context: .
      dockerfile: Dockerfile.auth
    ports: []
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://admin:password@postgres:5432/studyplatform?sslmode=disable
      JWT_SECRET: your-secret-key-here
      GRPC_PORT: 8081
    volumes:
      - ./auth-service:/app
    healthcheck:
      test: ["CMD", "grpc_health_probe", "-addr=:8081"]
      interval: 30s
      timeout: 10s
      retries: 3

  course-service:
    build:
      context: .
      dockerfile: Dockerfile.course
    ports: []
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://admin:password@postgres:5432/studyplatform?sslmode=disable
      GRPC_PORT: 8082
    volumes:
      - ./course-service:/app
    healthcheck:
      test: ["CMD", "grpc_health_probe", "-addr=:8082"]
      interval: 30s
      timeout: 10s
      retries: 3

  progress-service:
    build:
      context: .
      dockerfile: Dockerfile.progress
    ports: []
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://admin:password@postgres:5432/studyplatform?sslmode=disable
      GRPC_PORT: 8083
    volumes:
      - ./progress-service:/app
    healthcheck:
      test: ["CMD", "grpc_health_probe", "-addr=:8083"]
      interval: 30s
      timeout: 10s
      retries: 3

  video-service:
    build:
      context: ./video-service
      dockerfile: Dockerfile
    ports: []
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      # Database Configuration
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: admin
      DB_PASSWORD: password
      DB_NAME: studyplatform

      # Service Configuration
      VIDEO_SERVICE_PORT: 8084
      VIDEO_SERVICE_HOST: 0.0.0.0

      # Cloudflare Stream Configuration
      CLOUDFLARE_ACCOUNT_ID: ${CLOUDFLARE_ACCOUNT_ID}
      CLOUDFLARE_STREAM_TOKEN: ${CLOUDFLARE_STREAM_TOKEN}

      # Redis Configuration
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ""
      REDIS_DB: 0

      # Security
      JWT_SECRET: your-secret-key-here
    volumes:
      - ./video-service:/app
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:8084/health",
        ]
      interval: 30s
      timeout: 10s
      retries: 3

  bucket-service:
    build:
      context: ./bucket-service
      dockerfile: Dockerfile
    ports: []
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Database Configuration
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: admin
      DB_PASSWORD: password
      DB_NAME: studyplatform
      DB_SSLMODE: disable

      # AWS S3 Configuration
      S3_ENDPOINT: https://s3.amazonaws.com
      S3_REGION: ap-southeast-2
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}

      # Bucket Names
      S3_BUCKET_FILES: study-platform-files-khoipn-dev
      S3_BUCKET_DOCUMENTS: study-platform-documents-khoipn-dev
      S3_BUCKET_IMAGES: study-platform-images-khoipn-dev
      S3_BUCKET_AVATARS: study-platform-avatars-khoipn-dev
      S3_BUCKET_COURSE_MATERIALS: study-platform-course-materials-khoipn-dev

      # Service Configuration
      BUCKET_SERVICE_PORT: 8085
      BUCKET_SERVICE_HOST: 0.0.0.0
      ENVIRONMENT: development
      JWT_SECRET: your-secret-key-here

      # CORS
      CORS_ORIGINS: http://localhost:3000,http://localhost:8080
    volumes:
      - ./bucket-service:/app
      - bucket_logs:/app/logs
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:8085/health",
        ]
      interval: 30s
      timeout: 10s
      retries: 3

  chatbot-service:
    build:
      context: ./chatbot-service
      dockerfile: Dockerfile
    ports: []
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Database Configuration
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: admin
      DB_PASSWORD: password
      DB_NAME: studyplatform
      DB_SSLMODE: disable

      # Service Configuration
      CHATBOT_PORT: 8086
      CHATBOT_HOST: 0.0.0.0

      # OpenAI Configuration
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_MODEL: gpt-3.5-turbo
      OPENAI_MAX_TOKENS: 1000
      OPENAI_TEMPERATURE: 0.7

      # Redis Configuration (optional)
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ""
      REDIS_DB: 0
    volumes:
      - ./chatbot-service:/app
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:8086/health",
        ]
      interval: 30s
      timeout: 10s
      retries: 3

  forum-service:
    build:
      context: ./forum-service
      dockerfile: Dockerfile
    ports: []
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Database Configuration
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: admin
      DB_PASSWORD: password
      DB_NAME: studyplatform
      DB_SSLMODE: disable

      # Service Configuration
      FORUM_PORT: 8087
      FORUM_HOST: 0.0.0.0
    volumes:
      - ./forum-service:/app
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:8087/health",
        ]
      interval: 30s
      timeout: 10s
      retries: 3

  payment-service:
    build:
      context: .
      dockerfile: Dockerfile.payment
    ports: []
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Database Configuration
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: admin
      DB_PASSWORD: password
      DB_NAME: studyplatform
      DB_SSLMODE: disable

      # Service Configuration
      PAYMENT_PORT: 8088
      PAYMENT_HOST: 0.0.0.0

      # Payment Gateway Configuration
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-sk_test_dummy}
      STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY:-pk_test_dummy}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-whsec_dummy}
      PAYPAL_CLIENT_ID: ${PAYPAL_CLIENT_ID:-}
      PAYPAL_CLIENT_SECRET: ${PAYPAL_CLIENT_SECRET:-}
      PAYPAL_SANDBOX: "true"
      PAYMENT_CURRENCY: USD

      # Progress Service Integration
      PROGRESS_SERVICE_URL: progress-service:8083
    volumes:
      - ./payment-service:/app
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:8088/health",
        ]
      interval: 30s
      timeout: 10s
      retries: 3

  api-gateway:
    build:
      context: .
      dockerfile: Dockerfile.gateway
    ports:
      - "8080:8080"
    depends_on:
      - auth-service
      - course-service
      - progress-service
      - video-service
      - bucket-service
      - chatbot-service
      - forum-service
      - payment-service
    environment:
      AUTH_SERVICE_URL: auth-service:8081
      COURSE_SERVICE_URL: course-service:8082
      PROGRESS_SERVICE_URL: progress-service:8083
      VIDEO_SERVICE_URL: http://video-service:8084
      BUCKET_SERVICE_URL: http://bucket-service:8085
      CHATBOT_SERVICE_URL: http://chatbot-service:8086
      FORUM_SERVICE_URL: http://forum-service:8087
      PAYMENT_SERVICE_URL: http://payment-service:8088
      JWT_SECRET: your-secret-key-here
      HTTP_PORT: 8080
    volumes:
      - ./api-gateway:/app

volumes:
  postgres_data:
  redis_data:
  minio_data:
  bucket_logs:

networks:
  default:
    driver: bridge