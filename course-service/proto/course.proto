syntax = "proto3";

package course;

option go_package = "github.com/study-platform/course-service/proto";

import "google/protobuf/timestamp.proto";

service CourseService {
    // Course management
    rpc CreateCourse(CreateCourseRequest) returns (CreateCourseResponse);
    rpc GetCourse(GetCourseRequest) returns (GetCourseResponse);
    rpc UpdateCourse(UpdateCourseRequest) returns (UpdateCourseResponse);
    rpc DeleteCourse(DeleteCourseRequest) returns (DeleteCourseResponse);
    rpc ListCourses(ListCoursesRequest) returns (ListCoursesResponse);
    rpc SearchCourses(SearchCoursesRequest) returns (SearchCoursesResponse);

    // Lecture management
    rpc CreateLecture(CreateLectureRequest) returns (CreateLectureResponse);
    rpc GetLecture(GetLectureRequest) returns (GetLectureResponse);
    rpc UpdateLecture(UpdateLectureRequest) returns (UpdateLectureResponse);
    rpc DeleteLecture(DeleteLectureRequest) returns (DeleteLectureResponse);
    rpc ListLectures(ListLecturesRequest) returns (ListLecturesResponse);

    // Course enrollment
    rpc EnrollInCourse(EnrollInCourseRequest) returns (EnrollInCourseResponse);
    rpc GetEnrollment(GetEnrollmentRequest) returns (GetEnrollmentResponse);
    rpc ListEnrollments(ListEnrollmentsRequest) returns (ListEnrollmentsResponse);
}

service AccessValidationService {
    // Access validation
    rpc ValidateCourseAccess(ValidateCourseAccessRequest) returns (ValidateCourseAccessResponse);
    rpc ValidateLectureAccess(ValidateLectureAccessRequest) returns (ValidateLectureAccessResponse);
    rpc ValidateResourceAccess(ValidateResourceAccessRequest) returns (ValidateResourceAccessResponse);
    rpc BatchValidateAccess(BatchValidateAccessRequest) returns (BatchValidateAccessResponse);
}

// Course messages
message Course {
    string id = 1;
    string title = 2;
    string description = 3;
    string instructor_id = 4;
    string instructor_name = 5;
    string category = 6;
    string level = 7; // beginner, intermediate, advanced
    double price = 8;
    string currency = 9;
    string thumbnail_url = 10;
    string status = 11; // draft, published, archived
    int32 duration_minutes = 12;
    int32 enrollment_count = 13;
    double rating = 14;
    int32 rating_count = 15;
    repeated string tags = 16;
    google.protobuf.Timestamp created_at = 17;
    google.protobuf.Timestamp updated_at = 18;
    // Additional fields for complete course information
    string difficulty_level = 19;
    string language = 20;
    repeated string learning_outcomes = 21;
    repeated string requirements = 22;
    int32 estimated_duration_hours = 23;
    bool auto_approve_enrollment = 24;
    bool allow_previews = 25;
    bool has_certificate = 26;
    bool mobile_access = 27;
    repeated Lecture lectures = 28;
    repeated CourseResource resources = 29;
}

message Lecture {
    string id = 1;
    string course_id = 2;
    string title = 3;
    string description = 4;
    string type = 5; // video, document, quiz, etc.
    int32 order_number = 6;
    int32 duration_minutes = 7;
    string video_url = 8;
    string video_id = 9;
    string status = 10; // draft, published
    bool is_free = 11;
    google.protobuf.Timestamp created_at = 12;
    google.protobuf.Timestamp updated_at = 13;
    repeated LectureResource resources = 14;
}

message CourseResource {
    string id = 1;
    string course_id = 2;
    string file_id = 3;
    string resource_type = 4;
    int32 display_order = 5;
    bool is_required = 6;
    google.protobuf.Timestamp created_at = 7;
    google.protobuf.Timestamp updated_at = 8;
    // File information
    string filename = 9;
    string original_name = 10;
    string file_type = 11;
    int64 file_size = 12;
    string download_url = 13;
    bool is_public = 14;
    google.protobuf.Timestamp uploaded_at = 15;
}

message LectureResource {
    string id = 1;
    string lecture_id = 2;
    string file_id = 3;
    string resource_type = 4;
    int32 display_order = 5;
    bool is_required = 6;
    google.protobuf.Timestamp created_at = 7;
    google.protobuf.Timestamp updated_at = 8;
    // File information
    string filename = 9;
    string original_name = 10;
    string file_type = 11;
    int64 file_size = 12;
    string download_url = 13;
    bool is_public = 14;
    google.protobuf.Timestamp uploaded_at = 15;
}

message Enrollment {
    string id = 1;
    string user_id = 2;
    string course_id = 3;
    string status = 4; // enrolled, completed, cancelled
    double progress_percentage = 5;
    google.protobuf.Timestamp enrolled_at = 6;
    google.protobuf.Timestamp completed_at = 7;
    google.protobuf.Timestamp last_accessed = 8;
}

// Course requests/responses
message CreateCourseRequest {
    string title = 1;
    string description = 2;
    string instructor_id = 3;
    string category = 4;
    string level = 5;
    double price = 6;
    string currency = 7;
    string thumbnail_url = 8;
    string status = 9;
    repeated string tags = 10;
}

message CreateCourseResponse {
    Course course = 1;
    string message = 2;
}

message GetCourseRequest {
    string id = 1;
}

message GetCourseResponse {
    Course course = 1;
}

message UpdateCourseRequest {
    string id = 1;
    string title = 2;
    string description = 3;
    string category = 4;
    string level = 5;
    double price = 6;
    string currency = 7;
    string thumbnail_url = 8;
    string status = 9;
    repeated string tags = 10;
}

message UpdateCourseResponse {
    Course course = 1;
    string message = 2;
}

message DeleteCourseRequest {
    string id = 1;
}

message DeleteCourseResponse {
    string message = 1;
}

message ListCoursesRequest {
    int32 page = 1;
    int32 page_size = 2;
    string category = 3;
    string level = 4;
    string status = 5;
    string instructor_id = 6;
}

message ListCoursesResponse {
    repeated Course courses = 1;
    int32 total_count = 2;
    int32 page = 3;
    int32 page_size = 4;
}

message SearchCoursesRequest {
    string query = 1;
    int32 page = 2;
    int32 page_size = 3;
    string category = 4;
    string level = 5;
    double min_price = 6;
    double max_price = 7;
    double min_rating = 8;
}

message SearchCoursesResponse {
    repeated Course courses = 1;
    int32 total_count = 2;
    int32 page = 3;
    int32 page_size = 4;
}

// Lecture requests/responses
message CreateLectureRequest {
    string course_id = 1;
    string title = 2;
    string description = 3;
    int32 order_number = 4;
    int32 duration_minutes = 5;
    string video_url = 6;
    string video_id = 7;
    bool is_free = 8;
}

message CreateLectureResponse {
    Lecture lecture = 1;
    string message = 2;
}

message GetLectureRequest {
    string id = 1;
}

message GetLectureResponse {
    Lecture lecture = 1;
}

message UpdateLectureRequest {
    string id = 1;
    string title = 2;
    string description = 3;
    int32 order_number = 4;
    int32 duration_minutes = 5;
    string video_url = 6;
    string video_id = 7;
    string status = 8;
    bool is_free = 9;
}

message UpdateLectureResponse {
    Lecture lecture = 1;
    string message = 2;
}

message DeleteLectureRequest {
    string id = 1;
}

message DeleteLectureResponse {
    string message = 1;
}

message ListLecturesRequest {
    string course_id = 1;
    string status = 2;
    int32 page = 3;
    int32 page_size = 4;
}

message ListLecturesResponse {
    repeated Lecture lectures = 1;
    int32 total_count = 2;
    int32 page = 3;
    int32 page_size = 4;
}

// Enrollment requests/responses
message EnrollInCourseRequest {
    string user_id = 1;
    string course_id = 2;
}

message EnrollInCourseResponse {
    Enrollment enrollment = 1;
    string message = 2;
}

message GetEnrollmentRequest {
    string user_id = 1;
    string course_id = 2;
}

message GetEnrollmentResponse {
    Enrollment enrollment = 1;
}

message ListEnrollmentsRequest {
    string user_id = 1;
    string status = 2;
    int32 page = 3;
    int32 page_size = 4;
}

message ListEnrollmentsResponse {
    repeated Enrollment enrollments = 1;
    int32 total_count = 2;
    int32 page = 3;
    int32 page_size = 4;
}

// Access validation requests/responses
message ValidateCourseAccessRequest {
    string user_id = 1;
    string course_id = 2;
    string user_role = 3;
}

message ValidateCourseAccessResponse {
    bool has_access = 1;
    string access_level = 2; // none, student, instructor, owner, admin
    string message = 3;
    string error_code = 4;
    int64 expires_at = 5;
    double course_price = 6;
    string course_currency = 7;
    string enrollment_id = 8;
}

message ValidateLectureAccessRequest {
    string user_id = 1;
    string lecture_id = 2;
    string user_role = 3;
    bool enforce_sequential_access = 4;
}

message ValidateLectureAccessResponse {
    bool has_access = 1;
    string access_level = 2;
    string message = 3;
    string error_code = 4;
    int64 expires_at = 5;
    string course_id = 6;
    int32 lecture_order = 7;
    int32 duration = 8;
    int64 available_from = 9;
    double course_price = 10;
    string course_currency = 11;
}

message ValidateResourceAccessRequest {
    string user_id = 1;
    string resource_id = 2;
    string user_role = 3;
    string requested_action = 4; // view, download, edit, delete
}

message ValidateResourceAccessResponse {
    bool has_access = 1;
    string access_level = 2;
    string message = 3;
    string error_code = 4;
    repeated string allowed_actions = 5;
    string resource_type = 6;
    string course_id = 7;
}

message BatchAccessValidationItem {
    string resource_id = 1;
    string resource_type = 2; // course, lecture, resource
}

message BatchValidateAccessRequest {
    string user_id = 1;
    string user_role = 2;
    repeated BatchAccessValidationItem items = 3;
}

message BatchAccessValidationResult {
    string resource_id = 1;
    string resource_type = 2;
    bool has_access = 3;
    string access_level = 4;
    string message = 5;
    string error_code = 6;
}

message BatchValidateAccessResponse {
    repeated BatchAccessValidationResult results = 1;
}