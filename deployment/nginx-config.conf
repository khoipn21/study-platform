# Nginx configuration for Study Platform
# Place this file at: /etc/nginx/sites-available/study-platform
# Enable with: sudo ln -s /etc/nginx/sites-available/study-platform /etc/nginx/sites-enabled/
# Test with: sudo nginx -t
# Reload with: sudo systemctl reload nginx

upstream api_gateway {
    server localhost:8080;
}

# HTTP server - redirect to HTTPS (when SSL is configured)
server {
    listen 80;
    listen [::]:80;
    server_name study.khoipn.id.vn;

    # Allow Let's Encrypt verification
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # For now, proxy all traffic (comment this out after SSL setup)
    location / {
        proxy_pass http://api_gateway;
        proxy_http_version 1.1;
        
        # Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        
        # WebSocket support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        
        # Buffering
        proxy_buffering off;
        proxy_request_buffering off;
    }

    # Uncomment after SSL setup to redirect to HTTPS
    # return 301 https://$server_name$request_uri;
}

