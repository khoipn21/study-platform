version: '3.8'

services:
  # Infrastructure Services
  postgres:
    image: postgres:16
    container_name: study-platform-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "2345:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: study-platform-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped

  minio:
    image: minio/minio
    container_name: study-platform-minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    restart: unless-stopped

  # Application Services - Pre-built images from GHCR
  api-gateway:
    image: ghcr.io/khoipn21/study-platform/api-gateway:latest
    container_name: study-platform-api-gateway
    env_file:
      - .env
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      auth-service:
        condition: service_started
      course-service:
        condition: service_started
      progress-service:
        condition: service_started
    restart: unless-stopped

  auth-service:
    image: ghcr.io/khoipn21/study-platform/auth-service:latest
    container_name: study-platform-auth-service
    env_file:
      - .env
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  course-service:
    image: ghcr.io/khoipn21/study-platform/course-service:latest
    container_name: study-platform-course-service
    env_file:
      - .env
    ports:
      - "8082:8082"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  progress-service:
    image: ghcr.io/khoipn21/study-platform/progress-service:latest
    container_name: study-platform-progress-service
    env_file:
      - .env
    ports:
      - "8083:8083"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  video-service:
    image: ghcr.io/khoipn21/study-platform/video-service:latest
    container_name: study-platform-video-service
    env_file:
      - .env
    ports:
      - "8084:8084"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  bucket-service:
    image: ghcr.io/khoipn21/study-platform/bucket-service:latest
    container_name: study-platform-bucket-service
    env_file:
      - .env
    ports:
      - "8085:8085"
    depends_on:
      minio:
        condition: service_healthy
    restart: unless-stopped

  chatbot-service:
    image: ghcr.io/khoipn21/study-platform/chatbot-service:latest
    container_name: study-platform-chatbot-service
    env_file:
      - .env
    ports:
      - "8086:8086"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  forum-service:
    image: ghcr.io/khoipn21/study-platform/forum-service:latest
    container_name: study-platform-forum-service
    env_file:
      - .env
    ports:
      - "8087:8087"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  payment-service:
    image: ghcr.io/khoipn21/study-platform/payment-service:latest
    container_name: study-platform-payment-service
    env_file:
      - .env
    ports:
      - "8088:8088"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  instructor-dashboard-service:
    image: ghcr.io/khoipn21/study-platform/instructor-dashboard-service:latest
    container_name: study-platform-instructor-dashboard
    env_file:
      - .env
    ports:
      - "8089:8089"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  minio_data:
