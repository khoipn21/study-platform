name: Deploy via AWS SSM

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-2
      
      - name: Deploy via SSM Run Command
        run: |
          # Send deployment command via AWS Systems Manager
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "i-01c0bb5a88ec8cc28" \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=[
              "cd /opt/study-platform",
              "echo \"Starting deployment at $(date)\"",
              "git fetch origin",
              "git reset --hard origin/master",
              "git clean -fd",
              "docker compose down || true",
              "docker compose up -d --build",
              "sleep 30",
              "docker compose ps",
              "curl -f http://localhost:8080/api/v1/health || echo \"Health check pending\"",
              "echo \"Deployment completed at $(date)\""
            ]' \
            --output text \
            --query "Command.CommandId")
          
          echo "Command ID: $COMMAND_ID"
          echo "Waiting for command to complete..."
          
          # Wait for command to complete (max 10 minutes)
          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "i-01c0bb5a88ec8cc28" || true
          
          # Get command output
          echo "=== Command Output ==="
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "i-01c0bb5a88ec8cc28" \
            --query "StandardOutputContent" \
            --output text
          
          # Check if command succeeded
          STATUS=$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "i-01c0bb5a88ec8cc28" \
            --query "Status" \
            --output text)
          
          if [ "$STATUS" = "Success" ]; then
            echo "✓ Deployment completed successfully!"
          else
            echo "✗ Deployment failed with status: $STATUS"
            echo "=== Error Output ==="
            aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "i-01c0bb5a88ec8cc28" \
              --query "StandardErrorContent" \
              --output text
            exit 1
          fi
