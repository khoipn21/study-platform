name: Deploy to EC2

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Setup SSH
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$EC2_SSH_KEY" > ~/.ssh/deploy_key.pem
          chmod 600 ~/.ssh/deploy_key.pem
          
      - name: Add SSH host key
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts
          
      - name: Deploy to EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USERNAME: ${{ secrets.EC2_USERNAME }}
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
        run: |
          cat > deploy_script.sh << 'SCRIPT_EOF'
          set -e
          
          # Navigate to project directory or clone
          if [ ! -d ~/study-platform ]; then
            echo 'First time deployment - cloning repository'
            cd ~
            git clone https://DEPLOY_TOKEN_PLACEHOLDER@github.com/khoipn21/study-platform.git
            cd study-platform
          else
            cd ~/study-platform
          fi
          
          # Pull latest changes
          git fetch origin
          git reset --hard origin/master
          
          # Stop running containers
          docker compose down || true
          
          # Start services in detached mode
          docker compose up -d --build
          
          # Cleanup old images
          docker image prune -f
          
          echo 'Deployment completed successfully'
          SCRIPT_EOF
          
          sed -i "s/DEPLOY_TOKEN_PLACEHOLDER/$DEPLOY_TOKEN/g" deploy_script.sh
          
          scp -i ~/.ssh/deploy_key.pem -o StrictHostKeyChecking=no deploy_script.sh "$EC2_USERNAME@$EC2_HOST":~/deploy_script.sh
          ssh -i ~/.ssh/deploy_key.pem -o StrictHostKeyChecking=no "$EC2_USERNAME@$EC2_HOST" "bash ~/deploy_script.sh && rm ~/deploy_script.sh"
          rm deploy_script.sh
