name: Deploy to EC2

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          # Write key to file with proper formatting
          printf '%s\n' "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/ec2-key.pem
          chmod 600 ~/.ssh/ec2-key.pem
          
          # Configure SSH client for better connectivity
          cat >> ~/.ssh/config << 'EOF'
          Host *
            ServerAliveInterval 60
            ServerAliveCountMax 10
            TCPKeepAlive yes
            ConnectTimeout 30
          EOF
          
          # Verify key format
          echo "Key file stats:"
          wc -l ~/.ssh/ec2-key.pem
          ssh-keygen -l -f ~/.ssh/ec2-key.pem || (echo "Invalid SSH key format" && exit 1)
          
          # Add host to known hosts
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts 2>/dev/null || true
          
          # Test SSH connection with retries
          echo "Testing SSH connection to ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}..."
          MAX_RETRIES=5
          RETRY_COUNT=0
          while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
            if ssh -i ~/.ssh/ec2-key.pem -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} "echo 'SSH test successful'" 2>&1; then
              echo "✓ SSH connection established successfully"
              break
            else
              RETRY_COUNT=$((RETRY_COUNT + 1))
              if [ $RETRY_COUNT -eq $MAX_RETRIES ]; then
                echo "✗ SSH connection failed after $MAX_RETRIES attempts"
                echo "Please check:"
                echo "1. EC2 instance is running and accessible"
                echo "2. Security group allows SSH (port 22) from GitHub Actions IP"
                echo "3. EC2_HOST, EC2_USER, and EC2_SSH_KEY secrets are correctly configured"
                echo "Continuing anyway as the issue might be temporary..."
                break
              else
                echo "SSH attempt $RETRY_COUNT failed, retrying in 10 seconds..."
                sleep 10
              fi
            fi
          done

      - name: Initial EC2 Setup (First time only)
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          ssh -i ~/.ssh/ec2-key.pem -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o LogLevel=ERROR ${EC2_USER}@${EC2_HOST} bash << 'ENDSSH'
            set -e
            
            # Check if setup already done
            if [ ! -f "/opt/study-platform/.setup-completed" ]; then
              echo "Running initial EC2 setup..."
              
              # Update system
              sudo apt-get update
              sudo apt-get upgrade -y
              
              # Install Docker
              if ! command -v docker &> /dev/null; then
                curl -fsSL https://get.docker.com -o get-docker.sh
                sudo sh get-docker.sh
                sudo usermod -aG docker ubuntu
                rm get-docker.sh
                newgrp docker
              fi
              
              # Install Docker Compose
              sudo apt-get install -y docker-compose-plugin
              
              # Install other tools
              sudo apt-get install -y git nginx certbot python3-certbot-nginx
              
              # Create app directory
              sudo mkdir -p /opt/study-platform
              sudo chown -R ubuntu:ubuntu /opt/study-platform
              
              # Mark setup as completed
              touch /opt/study-platform/.setup-completed
              
              echo "Initial setup completed!"
            else
              echo "Setup already completed, skipping..."
            fi
          ENDSSH

      - name: Create Production Environment File
        env:
          PRODUCTION_ENV: ${{ secrets.PRODUCTION_ENV }}
        run: |
          echo "$PRODUCTION_ENV" > /tmp/.env.production

      - name: Deploy Application
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          GH_TOKEN: ${{ secrets.GH_DEPLOY_TOKEN }}
        run: |
          # Copy .env file to server
          scp -i ~/.ssh/ec2-key.pem -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o LogLevel=ERROR /tmp/.env.production ${EC2_USER}@${EC2_HOST}:/tmp/.env.production

          ssh -i ~/.ssh/ec2-key.pem -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o LogLevel=ERROR ${EC2_USER}@${EC2_HOST} bash << 'ENDSSH'
            set -e
            
            cd /opt/study-platform
            
            # Clone or update repository using GitHub token
            if [ -d ".git" ]; then
              echo "Updating existing repository..."
              git fetch origin
              git reset --hard origin/master
              git clean -fd
            else
              echo "Initializing repository..."
              # Initialize git repo and pull instead of clone
              git init
              git remote add origin https://${GH_TOKEN}@github.com/khoipn21/study-platform.git
              git fetch origin
              git checkout -f master
              git reset --hard origin/master
              git clean -fd
              echo "Repository initialized and updated!"
            fi
            
            # Move production .env file
            echo "Setting up production .env file..."
            mv /tmp/.env.production .env
            chmod 600 .env
            
            # Configure Nginx if not already done
            if [ ! -f "/etc/nginx/sites-enabled/study-platform" ]; then
              echo "Configuring Nginx..."
              sudo cp deployment/nginx-config.conf /etc/nginx/sites-available/study-platform
              sudo ln -sf /etc/nginx/sites-available/study-platform /etc/nginx/sites-enabled/
              sudo rm -f /etc/nginx/sites-enabled/default
              sudo nginx -t && sudo systemctl reload nginx
            fi
            
            # Stop existing services
            if [ -f "docker-compose.yml" ]; then
              echo "Stopping existing services..."
              docker compose down || true
            fi
            
            # Build and start services with progress output
            echo "=== Starting Docker build and deployment ==="
            echo "Build started at: $(date)"
            echo "This process may take several minutes..."
            
            # Run docker compose with output to keep connection alive
            docker compose up -d --build --force-recreate 2>&1 | while read -r line; do
              echo "[$(date '+%H:%M:%S')] $line"
            done
            
            echo "Build completed at: $(date)"
            
            # Wait for services to fully initialize
            echo "Waiting for services to initialize..."
            for i in {1..30}; do
              echo "Progress: $i/30 seconds..."
              sleep 1
            done
            
            # Check service status
            echo "=== Service Status ==="
            docker compose ps
            
            # Health check
            echo "=== Health Check ==="
            curl -f http://localhost:8080/api/v1/health || echo "Health check pending..."
            
            echo "=== Deployment completed successfully at $(date)! ==="
          ENDSSH

          # Clean up local temp file
          rm -f /tmp/.env.production

      - name: Setup SSL Certificate
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          DOMAIN_NAME: ${{ secrets.DOMAIN_NAME }}
          SSL_EMAIL: ${{ secrets.SSL_EMAIL }}
        run: |
          ssh -i ~/.ssh/ec2-key.pem -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o LogLevel=ERROR ${EC2_USER}@${EC2_HOST} bash << 'ENDSSH'
            set -e
            
            DOMAIN="${DOMAIN_NAME}"
            EMAIL="${SSL_EMAIL}"
            
            # Check if SSL certificate already exists
            if [ ! -f "/etc/letsencrypt/live/${DOMAIN}/fullchain.pem" ]; then
              echo "Obtaining SSL certificate for ${DOMAIN}..."
              
              # Obtain SSL certificate
              sudo certbot --nginx \
                -d ${DOMAIN} \
                --non-interactive \
                --agree-tos \
                --email ${EMAIL} \
                --redirect
              
              echo "SSL certificate obtained successfully!"
            else
              echo "SSL certificate already exists, renewing if needed..."
              sudo certbot renew --quiet || echo "Certificate renewal not needed yet"
            fi
            
            # Test nginx configuration
            sudo nginx -t
            sudo systemctl reload nginx
            
            # Setup automatic SSL renewal (cron job)
            if ! sudo crontab -l 2>/dev/null | grep -q "certbot renew"; then
              echo "Setting up automatic SSL certificate renewal..."
              (sudo crontab -l 2>/dev/null; echo "0 0,12 * * * certbot renew --quiet --post-hook 'systemctl reload nginx'") | sudo crontab -
              echo "Automatic renewal configured!"
            fi
            
            echo "HTTPS setup completed!"
          ENDSSH

      - name: Verify Deployment
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          DOMAIN_NAME: ${{ secrets.DOMAIN_NAME }}
        run: |
          ssh -i ~/.ssh/ec2-key.pem -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o LogLevel=ERROR ${EC2_USER}@${EC2_HOST} bash << 'ENDSSH'
            cd /opt/study-platform
            
            DOMAIN="${DOMAIN_NAME}"
            
            echo "=== Docker Compose Status ==="
            docker compose ps
            echo ""
            echo "=== Nginx Status ==="
            sudo systemctl status nginx --no-pager
            echo ""
            echo "=== SSL Certificate Status ==="
            sudo certbot certificates || echo "No certificates found"
            echo ""
            echo "=== API Gateway Health Check (HTTP) ==="
            curl -f http://localhost/api/v1/health || echo "HTTP health check failed"
            echo ""
            echo "=== API Gateway Health Check (HTTPS) ==="
            curl -fk https://${DOMAIN}/api/v1/health || echo "HTTPS health check failed"
            echo ""
            echo "=== API Gateway Health Check (direct) ==="
            curl -f http://localhost:8080/api/v1/health || echo "Direct health check failed"
          ENDSSH

      - name: Cleanup
        if: always()
        run: |
          rm -f ~/.ssh/ec2-key.pem
