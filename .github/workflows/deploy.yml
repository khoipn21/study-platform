name: Deploy to EC2

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Executing remote SSH commands
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            
            # Navigate to project directory or clone
            if [ ! -d ~/study-platform ]; then
              echo 'First time deployment - cloning repository'
              cd ~
              git clone https://${{ secrets.DEPLOY_TOKEN }}@github.com/khoipn21/study-platform.git
              cd study-platform
            else
              cd ~/study-platform
            fi
            
            # Pull latest changes
            git fetch origin
            git reset --hard origin/master
            
            # Stop running containers
            docker compose down || true
            
            # Start services in detached mode
            docker compose up -d --build
            
            # Cleanup old images
            docker image prune -f
            
            echo 'Deployment completed successfully'
      
      - name: Test deployment with curl
        if: success()
        run: |
          echo "Waiting 30 seconds for services to start..."
          sleep 30
          echo "Testing API Gateway endpoint..."
          curl -f -m 10 http://${{ secrets.EC2_HOST }}:8080/health || echo "Health check failed but deployment completed"
