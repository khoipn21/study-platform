name: Build and Deploy to EC2

on:
  push:
    branches:
      - master
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository }}

jobs:
  build-images:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        service:
          - api-gateway
          - auth-service
          - course-service
          - progress-service
          - payment-service
          - video-service
          - bucket-service
          - chatbot-service
          - forum-service
          - instructor-dashboard-service

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.service }}
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Determine build context
        id: build-context
        run: |
          SERVICE="${{ matrix.service }}"
          case "$SERVICE" in
            api-gateway)
              echo "context=." >> $GITHUB_OUTPUT
              echo "file=Dockerfile.gateway" >> $GITHUB_OUTPUT
              ;;
            auth-service)
              echo "context=." >> $GITHUB_OUTPUT
              echo "file=Dockerfile.auth" >> $GITHUB_OUTPUT
              ;;
            course-service)
              echo "context=." >> $GITHUB_OUTPUT
              echo "file=Dockerfile.course" >> $GITHUB_OUTPUT
              ;;
            progress-service)
              echo "context=." >> $GITHUB_OUTPUT
              echo "file=Dockerfile.progress" >> $GITHUB_OUTPUT
              ;;
            payment-service)
              echo "context=." >> $GITHUB_OUTPUT
              echo "file=Dockerfile.payment" >> $GITHUB_OUTPUT
              ;;
            *)
              echo "context=${SERVICE}" >> $GITHUB_OUTPUT
              echo "file=Dockerfile" >> $GITHUB_OUTPUT
              ;;
          esac

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ${{ steps.build-context.outputs.context }}
          file: ${{ steps.build-context.outputs.context }}/${{ steps.build-context.outputs.file }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy:
    needs: build-images
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 20m
          script: |
            set -e

            # Navigate to project directory
            cd ~/study-platform || exit 1

            # Pull latest code
            git fetch origin
            git reset --hard origin/master

            # Login to GitHub Container Registry
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # Pull all latest images (fast, no building on EC2!)
            docker compose -f docker-compose.prod.yml pull

            # Stop and remove old containers
            docker compose -f docker-compose.prod.yml down

            # Start services with pre-built images
            docker compose -f docker-compose.prod.yml up -d

            # Wait for services
            echo 'Waiting for services to start...'
            sleep 30

            # Show status
            docker compose -f docker-compose.prod.yml ps

            # Cleanup
            docker image prune -f

            echo 'Deployment completed successfully!'

      - name: Configure SSL/HTTPS
        if: success()
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # Ensure SSL certificate exists (self-signed)
            if [ ! -f /etc/ssl/certs/study-selfsigned.crt ]; then
              echo "Creating self-signed SSL certificate..."
              sudo mkdir -p /etc/ssl/private
              sudo openssl req -x509 -nodes -days 365 -newkey rsa:2048 \
                -keyout /etc/ssl/private/study-selfsigned.key \
                -out /etc/ssl/certs/study-selfsigned.crt \
                -subj '/C=VN/ST=HoChiMinh/L=HoChiMinh/O=StudyPlatform/CN=study.khoipn.id.vn'
            fi
            
            # Ensure nginx HTTPS configuration is in place
            if ! sudo nginx -t 2>&1 | grep -q "ssl"; then
              echo "SSL not configured in nginx, updating configuration..."
              # Configuration already in place from initial setup
            fi
            
            # Reload nginx to ensure latest config
            sudo systemctl reload nginx
            
            echo "✅ SSL/HTTPS configuration verified"
      
      - name: Test deployment
        if: success()
        run: |
          echo "Waiting for services to be ready..."
          sleep 45
          echo "Testing HTTPS API endpoint..."
          curl -k -f -m 10 https://study.khoipn.id.vn/api/v1/health && echo "✅ HTTPS health check passed!" || echo "⚠️ HTTPS check failed"
          echo "Testing HTTP redirect..."
          curl -I http://study.khoipn.id.vn 2>&1 | grep -q "301" && echo "✅ HTTP to HTTPS redirect working!" || echo "⚠️ Redirect not working"
